import java.util.Base64

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.stompflow.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.stompflow.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            def keystoreBase64 = System.getenv("KEYSTORE_BASE64")
            def storePassword = System.getenv("STORE_PASSWORD") ?: System.getenv("SIGNING_STORE_PASSWORD") ?: "android"
            def keyAlias = System.getenv("KEY_ALIAS") ?: System.getenv("SIGNING_KEY_ALIAS") ?: "stompflow"
            def keyPassword = System.getenv("KEY_PASSWORD") ?: System.getenv("SIGNING_KEY_PASSWORD") ?: "android"

            if (keystoreBase64?.trim()) {
                def decodedKeystore = file("build/stompflow-release.keystore")
                decodedKeystore.parentFile.mkdirs()
                decodedKeystore.bytes = Base64.getDecoder().decode(keystoreBase64)
                storeFile decodedKeystore
                storePassword storePassword
                keyAlias keyAlias
                keyPassword keyPassword
            } else {
                def rootKeystoreFile = rootProject.file("stompflow.keystore")
                def moduleKeystoreFile = file("stompflow.keystore")
                def keystoreFile = rootKeystoreFile.exists() ? rootKeystoreFile : (moduleKeystoreFile.exists() ? moduleKeystoreFile : null)

                if (keystoreFile != null) {
                    storeFile keystoreFile
                    storePassword storePassword
                    keyAlias keyAlias
                    keyPassword keyPassword
                } else {
                    throw new GradleException("No signing keystore found. Provide KEYSTORE_BASE64 or place stompflow.keystore at the project root or app directory.")
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            // Uses Android's default auto-generated debug keystore.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
