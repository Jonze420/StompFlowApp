name: Build and Release StompFlow APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stompflow-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build StompFlow Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout StompFlow
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          components: >-
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Verify APK
        run: |
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: APK was not produced."
            find app/build/outputs -type f -print || true
            exit 1
          fi

          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: |
          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            StompFlow-debug.apk

      # Downloadable from GitHub Actions
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StompFlow-debug-APK
          path: StompFlow-debug.apk
          if-no-files-found: error
          retention-days: 90

      # Create a GitHub Release for pushes to main/master
      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stompflow-build-${{ github.run_number }}
          name: StompFlow Build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: StompFlow-debug.apk
          fail_on_unmatched_files: true
          body: |
            # StompFlow Android APK

            Automated build from:
            `${{ github.repository }}`

            Commit:
            `${{ github.sha }}`

            Branch:
            `${{ github.ref_name }}`

            ## Installation

            Download `StompFlow-debug.apk` below and install it
            on your Android device.

            You may need to enable installation of apps from
            unknown sources in Android settings.
