<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multiple Time Zones</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .clock-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .clock-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
        }

        .timezone-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
            text-align: center;
        }

        .timezone-region {
            font-size: 0.9em;
            color: #999;
            text-align: center;
            margin-bottom: 15px;
        }

        .digital-display {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #00ff00;
            font-size: 3em;
            font-weight: bold;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .time-details {
            display: flex;
            justify-content: space-around;
            text-align: center;
            font-size: 0.9em;
            color: #555;
        }

        .time-details div {
            flex: 1;
        }

        .time-details span {
            display: block;
            font-weight: bold;
            color: #667eea;
            margin-top: 5px;
        }

        .controls {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .controls h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .timezone-input {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            flex: 1;
            min-width: 250px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: scale(0.98);
        }

        .delete-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 8px 15px;
            font-size: 0.9em;
        }

        .suggestions {
            margin-top: 15px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 0.9em;
            color: #666;
        }

        .suggestions strong {
            color: #667eea;
        }

        .format-toggle {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 15px;
        }

        .format-toggle label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-weight: 500;
        }

        .format-toggle input[type="radio"] {
            cursor: pointer;
        }

        .empty-message {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 1.1em;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .digital-display {
                font-size: 2em;
            }

            .clocks-grid {
                grid-template-columns: 1fr;
            }

            .timezone-input {
                flex-direction: column;
            }

            input[type="text"] {
                min-width: unset;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⏰ Global Time Zone Clock</h1>
            <p>Track time across multiple time zones in real-time</p>
        </div>

        <div class="controls">
            <h2>Add Time Zone</h2>
            <div class="timezone-input">
                <input 
                    type="text" 
                    id="timezoneInput" 
                    placeholder="Enter timezone (e.g., America/New_York, Europe/London, Asia/Tokyo)"
                >
                <button onclick="addTimezone()">Add Timezone</button>
            </div>
            <div class="suggestions">
                <strong>Popular timezones:</strong> America/New_York, America/Los_Angeles, Europe/London, Europe/Paris, Asia/Tokyo, Asia/Shanghai, Asia/Dubai, Australia/Sydney, UTC
            </div>
            <div class="format-toggle">
                <label>
                    <input type="radio" name="format" value="12" checked onchange="updateFormat()">
                    12-hour format
                </label>
                <label>
                    <input type="radio" name="format" value="24" onchange="updateFormat()">
                    24-hour format
                </label>
            </div>
        </div>

        <div class="clocks-grid" id="clocksContainer">
            <div class="empty-message">No time zones added yet. Add one to get started!</div>
        </div>
    </div>

    <script>
        const DEFAULT_TIMEZONES = [
            'UTC',
            'America/New_York',
            'America/Los_Angeles',
            'Europe/London',
            'Europe/Paris',
            'Asia/Tokyo',
            'Australia/Sydney'
        ];

        let timezones = [];
        let timeFormat = '12'; // '12' or '24'

        function initializeClock() {
            // Load saved timezones from localStorage
            const saved = localStorage.getItem('timezones');
            timezones = saved ? JSON.parse(saved) : DEFAULT_TIMEZONES;
            renderClocks();
            updateAllClocks();
            setInterval(updateAllClocks, 1000);
        }

        function updateFormat() {
            timeFormat = document.querySelector('input[name="format"]:checked').value;
            updateAllClocks();
        }

        function addTimezone() {
            const input = document.getElementById('timezoneInput');
            const timezone = input.value.trim();

            if (!timezone) {
                alert('Please enter a timezone');
                return;
            }

            // Validate timezone
            try {
                new Date().toLocaleString('en-US', { timeZone: timezone });
            } catch (e) {
                alert(`Invalid timezone: ${timezone}\n\nPlease use a valid IANA timezone name.`);
                return;
            }

            if (timezones.includes(timezone)) {
                alert('This timezone is already added');
                return;
            }

            timezones.push(timezone);
            saveTimezones();
            renderClocks();
            input.value = '';
            input.focus();
        }

        function removeTimezone(timezone) {
            timezones = timezones.filter(tz => tz !== timezone);
            saveTimezones();
            renderClocks();
        }

        function saveTimezones() {
            localStorage.setItem('timezones', JSON.stringify(timezones));
        }

        function renderClocks() {
            const container = document.getElementById('clocksContainer');

            if (timezones.length === 0) {
                container.innerHTML = '<div class="empty-message">No time zones added yet. Add one to get started!</div>';
                return;
            }

            container.innerHTML = timezones.map(timezone => `
                <div class="clock-card">
                    <div class="timezone-name">${timezone}</div>
                    <div class="timezone-region" id="region-${timezone}"></div>
                    <div class="digital-display" id="clock-${timezone}">00:00:00</div>
                    <div class="time-details">
                        <div>
                            Date
                            <span id="date-${timezone}">--/--/----</span>
                        </div>
                        <div>
                            Day
                            <span id="day-${timezone}">---</span>
                        </div>
                    </div>
                    <button class="delete-btn" onclick="removeTimezone('${timezone}')">Remove</button>
                </div>
            `).join('');
        }

        function updateAllClocks() {
            const now = new Date();

            timezones.forEach(timezone => {
                updateClock(timezone, now);
            });
        }

        function updateClock(timezone, now) {
            try {
                // Get time in the specific timezone
                const options = {
                    timeZone: timezone,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: timeFormat === '12'
                };

                const timeString = new Date(now.toLocaleString('en-US', { timeZone: timezone }))
                    .toLocaleString('en-US', options);

                // Update clock display
                const clockElement = document.getElementById(`clock-${timezone}`);
                if (clockElement) {
                    clockElement.textContent = timeString;
                }

                // Get date and day
                const dateOptions = {
                    timeZone: timezone,
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    weekday: 'long'
                };

                const dateString = new Date(now.toLocaleString('en-US', { timeZone: timezone }))
                    .toLocaleString('en-US', dateOptions);

                const parts = dateString.split(', ');
                const day = parts[0];
                const dateOnly = parts[1];

                const dateElement = document.getElementById(`date-${timezone}`);
                const dayElement = document.getElementById(`day-${timezone}`);

                if (dateElement) dateElement.textContent = dateOnly;
                if (dayElement) dayElement.textContent = day;

            } catch (e) {
                console.error(`Error updating clock for ${timezone}:`, e);
            }
        }

        // Allow Enter key to add timezone
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('timezoneInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addTimezone();
                }
            });

            initializeClock();
        });
    </script>
</body>
</html>
